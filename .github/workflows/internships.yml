name: Internship Monitor

on:
  schedule:
    # Every 30 minutes. Fetches are ETag-conditional, so an unchanged poll
    # costs a 304 rather than re-downloading the 12MB Simplify listing.
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Render messages without sending them'
        type: boolean
        default: false
      reseed:
        description: 'Rebuild the baseline, announcing nothing'
        type: boolean
        default: false

# A run that overlaps the previous one would read stale state and re-announce.
concurrency:
  group: internship-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run internship monitor
        env:
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_INTERNSHIPS_BOT_TOKEN: ${{ secrets.TELEGRAM_INTERNSHIPS_BOT_TOKEN }}
          TELEGRAM_INTERNSHIPS_CHAT_ID: ${{ secrets.TELEGRAM_INTERNSHIPS_CHAT_ID }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m internships.main \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.reseed && '--reseed' || '' }}

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/internships/
          if git diff-index --quiet HEAD --; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore: internship monitor state"
          # Workflows can finish at the same time and both try to push. Rebase
          # onto whatever landed first rather than failing the run.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              exit 0
            fi
            echo "Push race, retrying ($attempt/3)"
            sleep 5
          done
          echo "Could not push after 3 attempts"
          exit 1
